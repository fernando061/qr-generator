<div class="page">
  <main class="card" aria-live="polite">
    <div class="intro">
      <span class="eyebrow">Generador QR</span>
      <h1>Genera un QR limpio para tu enlace.</h1>
      <p class="subtitle">Pega una URL y descarga el codigo en PNG o SVG.</p>

      <form class="form" [formGroup]="form" (ngSubmit)="generateQr()" novalidate>
        <label class="field" [class.invalid]="showUrlError">
          <span class="label">URL</span>
          <input
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://tusitio.com"
            [formControl]="urlControl"
            [attr.aria-invalid]="showUrlError"
            [attr.aria-describedby]="showUrlError ? 'url-error' : null"
          />
          @if (showUrlError) {
            <span class="error" id="url-error">{{ urlErrorText }}</span>
          } @else {
            <span class="helper">Ej: https://ejemplo.com</span>
          }
        </label>

        <button
          class="primary"
          type="submit"
          [disabled]="isGenerateDisabled"
          [attr.aria-busy]="isGenerating()"
        >
          <span>{{ isGenerating() ? 'Generando...' : 'Generar QR' }}</span>
          @if (isGenerating()) {
            <span class="spinner" aria-hidden="true"></span>
          }
        </button>
      </form>
    </div>

    <section class="result">
      <div class="preview">
        @if (qrDataUrl(); as dataUrl) {
          <img [src]="dataUrl" alt="Codigo QR generado" />
        } @else {
          <div class="placeholder">
            <span>Tu QR aparecera aqui.</span>
          </div>
        }
        @if (isGenerating()) {
          <div class="loading-overlay" aria-hidden="true">
            <span class="loader"></span>
          </div>
        }
      </div>

      @if (errorMessage()) {
        <p class="error error-block">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <button type="button" class="ghost" [disabled]="!qrDataUrl()" (click)="downloadAs('png')">
          Descargar PNG
        </button>
        <button type="button" class="ghost" [disabled]="!svgMarkup()" (click)="downloadAs('svg')">
          Descargar SVG
        </button>
      </div>
    </section>
  </main>
</div>
